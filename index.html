<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Expense Tracker</h1>

    <!-- 1. FORM: where the user adds an expense -->
    <form id="expense-form">
      <input type="text" id="title" placeholder="What did you spend on? (e.g. Lunch)">
      <input type="number" id="amount" placeholder="Amount in ₹" min="1">
      <select id="category">
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Bills">Bills</option>
        <option value="Other">Other</option>
      </select>
      <input type="date" id="date">
      <button type="submit">Add Expense</button>
    </form>
    <p id="error" class="error"></p>

    <!-- 2. TOTAL -->
    <div class="total-box">
      Total: <span id="total">₹0</span>
    </div>

    <!-- 3. FILTER -->
    <div class="filter-row">
      <label for="filter">Show:</label>
      <select id="filter">
        <option value="All">All</option>
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Bills">Bills</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <!-- 4. LIST: JavaScript fills this -->
    <ul id="expense-list"></ul>
    <p id="empty-msg" class="empty">No expenses yet. Add your first one above!</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
